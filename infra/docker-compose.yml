services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: forgemind
      POSTGRES_USER: forgemind
      POSTGRES_PASSWORD: forgemind
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgemind -d forgemind"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:

