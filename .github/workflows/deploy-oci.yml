name: Deploy to OCI

on:
  workflow_dispatch:

concurrency:
  group: forgemind-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build_images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      runtime_base_image: ${{ steps.image_names.outputs.runtime_base }}
      runtime_image: ${{ steps.image_names.outputs.runtime }}
      web_image: ${{ steps.image_names.outputs.web }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Resolve image names
        id: image_names
        shell: bash
        run: |
          set -euo pipefail
          repository="${GITHUB_REPOSITORY,,}"
          dependency_hash="$(
            {
              printf '%s\n' infra/Dockerfile package.json package-lock.json packages/db/prisma/schema.prisma
              find apps packages -mindepth 2 -maxdepth 2 -name package.json -type f -print
            } | LC_ALL=C sort -u | xargs sha256sum | sha256sum | cut -d ' ' -f 1
          )"
          echo "runtime_base=ghcr.io/${repository}-runtime-base:deps-${dependency_hash}" >> "${GITHUB_OUTPUT}"
          echo "runtime=ghcr.io/${repository}-runtime:${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          echo "runtime_main=ghcr.io/${repository}-runtime:main" >> "${GITHUB_OUTPUT}"
          echo "web=ghcr.io/${repository}-web:${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          echo "web_main=ghcr.io/${repository}-web:main" >> "${GITHUB_OUTPUT}"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check runtime base image
        id: runtime_base
        shell: bash
        run: |
          if docker buildx imagetools inspect "${{ steps.image_names.outputs.runtime_base }}" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build and push runtime base image
        if: steps.runtime_base.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          target: runtime-base
          push: true
          tags: ${{ steps.image_names.outputs.runtime_base }}
          cache-from: type=gha,scope=forgemind-runtime-base
          cache-to: |
            type=gha,mode=max,scope=forgemind-runtime-base
            type=inline
          provenance: false
          sbom: false

      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          target: runtime
          push: true
          tags: |
            ${{ steps.image_names.outputs.runtime }}
            ${{ steps.image_names.outputs.runtime_main }}
          cache-from: |
            type=gha,scope=forgemind-production
            type=registry,ref=${{ steps.image_names.outputs.runtime_base }}
          cache-to: type=gha,mode=max,scope=forgemind-production
          provenance: false
          sbom: false

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          target: web
          push: true
          tags: |
            ${{ steps.image_names.outputs.web }}
            ${{ steps.image_names.outputs.web_main }}
          cache-from: type=gha,scope=forgemind-production
          cache-to: type=gha,mode=max,scope=forgemind-production
          provenance: false
          sbom: false

  deploy:
    needs: build_images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment: production
    env:
      APP_ROOT: /opt/forgemind
      RELEASE_ARCHIVE: forgemind-${{ github.sha }}.tar.gz
      FORGEMIND_RUNTIME_IMAGE: ${{ needs.build_images.outputs.runtime_image }}
      FORGEMIND_WEB_IMAGE: ${{ needs.build_images.outputs.web_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Build release archive
        run: git archive --format=tar.gz --output "${RELEASE_ARCHIVE}" HEAD

      - name: Configure SSH
        env:
          OCI_DEPLOY_SSH_KEY_B64: ${{ secrets.OCI_DEPLOY_SSH_KEY_B64 }}
          OCI_DEPLOY_HOST: ${{ secrets.OCI_DEPLOY_HOST }}
          OCI_DEPLOY_PORT: ${{ secrets.OCI_DEPLOY_PORT }}
        run: |
          set -euo pipefail
          DEPLOY_PORT="${OCI_DEPLOY_PORT:-22}"
          mkdir -p ~/.ssh
          printf '%s' "${OCI_DEPLOY_SSH_KEY_B64}" | base64 -d | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${DEPLOY_PORT}" -H "${OCI_DEPLOY_HOST}" >> ~/.ssh/known_hosts

      - name: Upload release archive
        env:
          OCI_DEPLOY_HOST: ${{ secrets.OCI_DEPLOY_HOST }}
          OCI_DEPLOY_USER: ${{ secrets.OCI_DEPLOY_USER }}
          OCI_DEPLOY_PORT: ${{ secrets.OCI_DEPLOY_PORT }}
        run: |
          set -euo pipefail
          DEPLOY_PORT="${OCI_DEPLOY_PORT:-22}"
          scp -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -P "${DEPLOY_PORT}" "${RELEASE_ARCHIVE}" "${OCI_DEPLOY_USER}@${OCI_DEPLOY_HOST}:/tmp/${RELEASE_ARCHIVE}"

      - name: Authenticate OCI host to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OCI_DEPLOY_HOST: ${{ secrets.OCI_DEPLOY_HOST }}
          OCI_DEPLOY_USER: ${{ secrets.OCI_DEPLOY_USER }}
          OCI_DEPLOY_PORT: ${{ secrets.OCI_DEPLOY_PORT }}
        run: |
          set -euo pipefail
          DEPLOY_PORT="${OCI_DEPLOY_PORT:-22}"
          printf '%s' "${GHCR_TOKEN}" | ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -p "${DEPLOY_PORT}" \
            "${OCI_DEPLOY_USER}@${OCI_DEPLOY_HOST}" \
            "docker login ghcr.io --username '${GITHUB_ACTOR}' --password-stdin"

      - name: Deploy release
        env:
          OCI_DEPLOY_HOST: ${{ secrets.OCI_DEPLOY_HOST }}
          OCI_DEPLOY_USER: ${{ secrets.OCI_DEPLOY_USER }}
          OCI_DEPLOY_PORT: ${{ secrets.OCI_DEPLOY_PORT }}
        run: |
          set -euo pipefail
          DEPLOY_PORT="${OCI_DEPLOY_PORT:-22}"
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -p "${DEPLOY_PORT}" "${OCI_DEPLOY_USER}@${OCI_DEPLOY_HOST}" "
            set -euo pipefail
            APP_ROOT='${APP_ROOT}'
            RELEASE_DIR=\"\${APP_ROOT}/releases/${{ github.sha }}\"
            mkdir -p \"\${RELEASE_DIR}\" \"\${APP_ROOT}/app\"
            tar -xzf \"/tmp/${RELEASE_ARCHIVE}\" -C \"\${RELEASE_DIR}\"
            rsync -a --delete \"\${RELEASE_DIR}/\" \"\${APP_ROOT}/app/\"
            rm -f \"/tmp/${RELEASE_ARCHIVE}\"
            APP_ROOT=\"\${APP_ROOT}\" \
            FORGEMIND_RUNTIME_IMAGE='${FORGEMIND_RUNTIME_IMAGE}' \
            FORGEMIND_WEB_IMAGE='${FORGEMIND_WEB_IMAGE}' \
            bash \"\${APP_ROOT}/app/infra/deploy/remote-deploy.sh\"
          "

      - name: Remove temporary GHCR credentials
        if: always()
        continue-on-error: true
        env:
          OCI_DEPLOY_HOST: ${{ secrets.OCI_DEPLOY_HOST }}
          OCI_DEPLOY_USER: ${{ secrets.OCI_DEPLOY_USER }}
          OCI_DEPLOY_PORT: ${{ secrets.OCI_DEPLOY_PORT }}
        run: |
          DEPLOY_PORT="${OCI_DEPLOY_PORT:-22}"
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -p "${DEPLOY_PORT}" \
            "${OCI_DEPLOY_USER}@${OCI_DEPLOY_HOST}" \
            "docker logout ghcr.io"
